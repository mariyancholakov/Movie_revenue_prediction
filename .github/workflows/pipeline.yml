# Scheduled data jobs for the MOVIEGROSS API, independent of where the API is
# hosted: they only need Supabase + TMDB, and write to the same Supabase the
# deployed API reads, so a warmed prediction is instantly served in production.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TMDB_API_KEY, SUPABASE_URL, SUPABASE_KEY (the sb_secret_… key)
#
# Retraining is deliberately manual: run the "retrain" job from the Actions
# tab and download the candidate-model artifact. If the report says it holds up
# against production, commit the model as
# flask-api/models/box_office_model_final.pkl, its ranges file as
# flask-api/models/forecast_ranges.json and its metrics file as
# flask-api/models/production_metrics.json, then redeploy.
name: data-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC — warm the prediction cache
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC — capture finished runs
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [warm-cache, capture, retrain]
        default: warm-cache

concurrency:
  group: data-pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: flask-api
    # Named explicitly so steps run with pipefail: `retrain.py | tee` must
    # fail the job when retrain.py fails, not report tee's success.
    shell: bash

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  warm-cache:
    if: github.event.schedule == '0 6 * * *' || inputs.job == 'warm-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: flask-api/.python-version
          cache: pip
          cache-dependency-path: flask-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python warm_cache.py

  capture:
    if: github.event.schedule == '0 3 * * 0' || inputs.job == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: flask-api/.python-version
          cache: pip
          cache-dependency-path: flask-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python capture_finished.py

  retrain:
    if: inputs.job == 'retrain'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: flask-api/.python-version
          cache: pip
          cache-dependency-path: flask-api/requirements.txt
      - run: pip install -r requirements.txt
      # Read-only: prints the holdout comparison and saves a candidate model.
      - run: python retrain.py | tee retrain-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-model
          path: |
            flask-api/models/candidate_*.pkl
            flask-api/models/candidate_*_ranges.json
            flask-api/models/candidate_*_metrics.json
            flask-api/retrain-report.txt
          if-no-files-found: warn
